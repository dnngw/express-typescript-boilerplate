name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boilerplate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HUSKY: 0
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters
      LOG_LEVEL: silent
      RATE_LIMIT_MAX: 10000
      AUTH_RATE_LIMIT_MAX: 10000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
